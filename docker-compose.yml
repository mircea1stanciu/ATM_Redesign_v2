x-backend-env: &backend-env
  ATM_DATABASE_URL: postgresql+psycopg2://testmanager:${POSTGRES_PASSWORD:-testmanager}@postgres:5432/testmanager
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  APP_ENV: production
  CORS_ORIGINS: '["http://localhost", "http://frontend"]'
  ARTIFACTS_DIR: /app/artifacts

services:
  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: testmanager_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: testmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testmanager}
      POSTGRES_DB: testmanager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testmanager_backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - artifacts_data:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (nginx + SPA) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: testmanager_frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  artifacts_data:
