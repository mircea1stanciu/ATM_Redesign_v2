[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testmanager-backend"
version = "0.1.0"
description = "ATM (AutomationTestManager) backend"
# The app uses `X | None` in pydantic models, which needs Python 3.10 at runtime.
requires-python = ">=3.10"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",  # Postgres via ATM_DATABASE_URL

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",  # encrypts personal tokens (user_connections)
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4.0",
    "python-multipart>=0.0.9",

    # HTTP client (MCP / GitHub API)
    "httpx>=0.27.0",

    # Utilities
    "python-dotenv>=1.0.1",

    # Imported by the app at startup (main.py): rate limiting, 2FA, QR codes
    "slowapi>=0.1.9",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
# Kept at py39 so lint does not rewrite every Optional[...] annotation; the runtime minimum is 3.10.
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Standard alembic/dotenv-config idiom: sys.path/config must run before the
# subsequent imports, so they can't be moved to the top of the file.
"alembic/env.py" = ["E402"]
# Generated table definitions (frozen schema of a revision).
"alembic/versions/*" = ["E501"]
"app/main.py" = ["E402"]
# One-off maintenance scripts and the UI-test seed; lightly linted.
"tools/*" = ["E501", "E402", "UP006", "UP035", "UP045"]
# Generated report page with minified CSS/JS (one statement per line by design).
"app/modules/reporting/report_template.py" = ["E501"]

[tool.mypy]
# Starter-project templates copied into users' folders, not part of the application.
exclude = ["^app/scaffolds/"]
# app/ is a namespace package (no __init__.py): map files to modules from the backend folder.
explicit_package_bases = true

[[tool.mypy.overrides]]
# Type-checking baseline: modules written before mypy ran in CI (mostly untyped SQLAlchemy
# `Column(...)` models, so attributes are typed Column[str] instead of str). New and fixed modules
# are fully checked; remove a module from this list once it is clean.
module = [
    "app.modules.identity.models",
    "app.modules.identity.router",
    "app.modules.learning.community_router",
    "app.modules.projects.router",
    "app.modules.reporting.router",
    "app.modules.reporting.service",
    "app.modules.settings.account_router",
    "app.modules.testing.router",
    "app.modules.testing.runs",
    "app.modules.work.models",
    "app.modules.work.tasks_service",
    "app.modules.workspace.assistant_router",
    "app.services.appium_project_service",
    "app.services.confluence_release_analyzer",
    "app.services.device_service",
    "app.services.github_workflow_service",
    "app.services.junit_parser",
    "app.services.local_library_service",
    "app.services.local_repo_service",
    "app.services.properties_service",
    "app.services.zephyr_service",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
