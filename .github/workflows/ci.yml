name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ─────────────────────────────────────────────
  # Branch naming guard for PRs
  # ─────────────────────────────────────────────
  branch-name-guard:
    name: Branch Prefix Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Validate source branch prefix
        env:
          HEAD_REF: ${{ github.head_ref }}
          REQUIRED_PREFIX: feature-mircea-feature-nou/
          # Redesign phases (docs/redesign/07-delivery-workflow.md): feature/phase_XX_featurename
          PHASE_PATTERN: ^feature/phase_[0-9]{2}_[a-z0-9_]+$
          # Fixes for issues found while testing (same document): feature/fixes_name
          FIX_PATTERN: ^feature/fixes_[a-z0-9_]+$
        run: |
          echo "PR source branch: ${HEAD_REF}"
          if [[ -z "${HEAD_REF}" ]]; then
            echo "ERROR: Could not detect PR source branch."
            exit 1
          fi

          if [[ "${HEAD_REF}" != ${REQUIRED_PREFIX}* && ! "${HEAD_REF}" =~ ${PHASE_PATTERN} && ! "${HEAD_REF}" =~ ${FIX_PATTERN} ]]; then
            echo "ERROR: Invalid branch name '${HEAD_REF}'."
            echo "Branch must start with '${REQUIRED_PREFIX}' or match '${PHASE_PATTERN}' or '${FIX_PATTERN}'."
            exit 1
          fi

          echo "Branch naming rule passed."

  # ─────────────────────────────────────────────
  # Backend — lint + type-check + tests
  # ─────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testmanager
          POSTGRES_PASSWORD: testmanager
          POSTGRES_DB: testmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testmanager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy app --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Migrations on Postgres
        env:
          ATM_DATABASE_URL: postgresql+psycopg2://testmanager:testmanager@localhost:5432/testmanager_test
        run: |
          alembic upgrade head
          alembic check

  # ─────────────────────────────────────────────
  # Frontend — lint + type-check + build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check + build
        run: npm run build

  # ─────────────────────────────────────────────
  # UI tests — Playwright against the real frontend and backend
  # ─────────────────────────────────────────────
  ui-tests:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        # [dev] brings pytest: the workspace tests run a pytest test through ATM.
        run: pip install -e ".[dev]"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        env:
          ATM_PYTHON: python
        run: npm run e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
